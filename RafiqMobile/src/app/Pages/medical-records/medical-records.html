<app-mobile-header
  [title]="t().sidebar.medicalRecords"
  [showNotifications]="true"
  [showAiButton]="true"
  (notificationsClicked)="notificationSvc.toggleNotificationCenter()"
  (aiClicked)="aiChatService.openPanel()">
</app-mobile-header>

<div class="m-page">
  <div class="m-body">

    <app-family-profile-banner [profile]="viewingProfile()" [readOnly]="contextReadOnly()" />
    <app-records-content
      [profileId]="contextProfileId()"
      [readOnly]="contextReadOnly()"
      assistantAnchor="medical-records-grid">
    </app-records-content>

    <div style="height:16px"></div>
  </div>

  <app-bottom-nav></app-bottom-nav>
</div>
