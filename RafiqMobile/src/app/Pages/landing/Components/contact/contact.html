<section id="contact" class="cta">
  <div class="container">
    <div class="cta-banner">
      <div class="cta-copy">
        <h2>{{ t.title }}</h2>
        <p>{{ t.subtitle }}</p>
        <button type="button" class="btn" (click)="onGetStarted()">{{ t.cta }}</button>
        <span class="cta-note">{{ t.note }}</span>
      </div>
      <img src="images/RafiqLogo.png" class="cta-robot" alt="Rafiq AI robot">
    </div>
  </div>
</section>
