<div class="onboarding-welcome-page">
  <!-- Background decorative blobs -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <div class="onboarding-layout">
    <div class="onboarding-card">

      <!-- Mascot Hero -->
      <div class="mascot-hero">
        <div class="mascot-glow"></div>
        <img src="/images/rafiq-robot.png" alt="Rafiq Mascot" class="mascot-img" />
      </div>

      <!-- Welcome Text -->
      <div class="welcome-content">
        <h1 class="welcome-title" assistantAnchor="onboarding-welcome-heading">
          {{ t().onboarding.welcome.title }}
        </h1>
        <p class="welcome-description">
          {{ t().onboarding.welcome.subtitle2 }}
        </p>
      </div>

      <!-- CTA Button -->
      <button class="cta-button" (click)="getStarted()">
        <span>{{ t().onboarding.welcome.getStarted }}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </button>

      <!-- Footer note -->
      <p class="footer-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        {{ t().onboarding.welcome.lessThanTwoMinutes }}
      </p>
    </div>
  </div>
</div>
