<svg width="400" height="440" viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="100%" stop-color="#bdeaff"/>
    </linearGradient>
    <linearGradient id="robotFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#123663"/>
    </linearGradient>
    <linearGradient id="robotBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18BFFF"/>
      <stop offset="100%" stop-color="#38E1C5"/>
    </linearGradient>
  </defs>

  <!-- ears -->
  <ellipse cx="70" cy="215" rx="16" ry="34" fill="url(#robotBody)" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="330" cy="215" rx="16" ry="34" fill="url(#robotBody)" stroke="#ffffff" stroke-width="2"/>

  <!-- antenna -->
  <line x1="200" y1="10" x2="200" y2="55" stroke="#8fd9f2" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="10" r="10" fill="url(#robotBadge)"/>

  <!-- head -->
  <rect x="110" y="55" width="180" height="150" rx="60" fill="url(#robotBody)" stroke="#ffffff" stroke-width="3"/>
  <!-- face plate -->
  <rect x="140" y="95" width="120" height="75" rx="38" fill="url(#robotFace)"/>
  <circle cx="178" cy="132" r="10" fill="#ffffff"/>
  <circle cx="222" cy="132" r="10" fill="#ffffff"/>

  <!-- body -->
  <rect x="95" y="205" width="210" height="200" rx="58" fill="url(#robotBody)" stroke="#ffffff" stroke-width="3"/>
  <!-- chest badge -->
  <rect x="168" y="255" width="64" height="64" rx="18" fill="url(#robotBadge)"/>
  <text x="200" y="300" font-family="Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle">R</text>

  <!-- arms -->
  <ellipse cx="88" cy="290" rx="22" ry="55" fill="url(#robotBody)" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="312" cy="290" rx="22" ry="55" fill="url(#robotBody)" stroke="#ffffff" stroke-width="2"/>
</svg>
