<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" fill="none">
  <!-- Background soft circle -->
  <circle cx="160" cy="130" r="100" fill="#dff5ff" opacity="0.55"/>
  <circle cx="80" cy="80" r="12" fill="#49d7ff" opacity="0.18"/>
  <circle cx="250" cy="90" r="8" fill="#4E89B8" opacity="0.15"/>
  <circle cx="60" cy="180" r="6" fill="#49d7ff" opacity="0.2"/>
  <circle cx="270" cy="170" r="10" fill="#4E89B8" opacity="0.13"/>

  <!-- Dotted connecting lines -->
  <line x1="110" y1="70" x2="135" y2="95" stroke="#49d7ff" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="210" y1="70" x2="190" y2="95" stroke="#49d7ff" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Clipboard body -->
  <rect x="110" y="85" rx="14" ry="14" width="100" height="130" fill="white" stroke="#4E89B8" stroke-width="2.5"/>
  <!-- Clipboard clip -->
  <rect x="140" y="78" rx="6" ry="6" width="40" height="18" fill="#4E89B8"/>
  <circle cx="160" cy="87" r="4" fill="white"/>

  <!-- Clipboard lines -->
  <rect x="128" y="115" rx="3" ry="3" width="64" height="6" fill="#dff5ff"/>
  <rect x="128" y="130" rx="3" ry="3" width="50" height="6" fill="#dff5ff"/>
  <rect x="128" y="145" rx="3" ry="3" width="58" height="6" fill="#dff5ff"/>
  <rect x="128" y="160" rx="3" ry="3" width="40" height="6" fill="#dff5ff"/>

  <!-- Checkmarks on clipboard -->
  <circle cx="132" cy="118" r="5" fill="#49d7ff"/>
  <path d="M130 118 L131.5 119.5 L134.5 116" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="132" cy="133" r="5" fill="#49d7ff"/>
  <path d="M130 133 L131.5 134.5 L134.5 131" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Heart with pulse -->
  <g transform="translate(180, 55)">
    <circle cx="0" cy="0" r="24" fill="#eef8ff" opacity="0.9"/>
    <path d="M0 12 C0 12 -14 2 -14 -5 C-14 -10 -10 -14 -6 -14 C-2 -14 0 -11 0 -11 C0 -11 2 -14 6 -14 C10 -14 14 -10 14 -5 C14 2 0 12 0 12Z" fill="#49d7ff"/>
    <!-- Pulse line on heart -->
    <path d="M-8 -2 L-4 -2 L-2 -6 L1 2 L4 -4 L6 -2 L10 -2" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stethoscope icon (left) -->
  <g transform="translate(75, 100)">
    <circle cx="0" cy="0" r="20" fill="white" stroke="#4E89B8" stroke-width="2"/>
    <path d="M-6 -6 C-6 -10 -2 -12 0 -12 C2 -12 6 -10 6 -6" stroke="#4E89B8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="-6" y1="-6" x2="-6" y2="0" stroke="#4E89B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="-6" x2="6" y2="0" stroke="#4E89B8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="6" cy="2" r="2.5" fill="#4E89B8"/>
    <path d="M-6 0 C-6 8 0 10 6 6" stroke="#4E89B8" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Shield icon (right) -->
  <g transform="translate(245, 110)">
    <circle cx="0" cy="0" r="20" fill="white" stroke="#4E89B8" stroke-width="2"/>
    <path d="M0 -10 L8 -6 L8 2 C8 8 0 12 0 12 C0 12 -8 8 -8 2 L-8 -6 Z" fill="#eef8ff" stroke="#4E89B8" stroke-width="1.5"/>
    <path d="M-3 0 L-1 2 L4 -3" stroke="#4E89B8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small floating plus signs -->
  <g transform="translate(100, 55)" fill="#49d7ff" opacity="0.5">
    <rect x="-1.5" y="-5" width="3" height="10" rx="1.5"/>
    <rect x="-5" y="-1.5" width="10" height="3" rx="1.5"/>
  </g>
  <g transform="translate(230, 180)" fill="#4E89B8" opacity="0.35">
    <rect x="-1" y="-4" width="2" height="8" rx="1"/>
    <rect x="-4" y="-1" width="8" height="2" rx="1"/>
  </g>

  <!-- Small dots decoration -->
  <circle cx="90" cy="160" r="3" fill="#49d7ff" opacity="0.3"/>
  <circle cx="230" cy="60" r="3" fill="#4E89B8" opacity="0.25"/>
  <circle cx="140" cy="230" r="2.5" fill="#49d7ff" opacity="0.3"/>
  <circle cx="200" cy="235" r="2" fill="#4E89B8" opacity="0.2"/>

  <!-- Bottom wave decoration -->
  <path d="M50 220 Q110 200 160 220 Q210 240 270 215" stroke="#49d7ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
