<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" fill="none">

  <!-- Glow / halo behind robot -->
  <ellipse cx="140" cy="240" rx="90" ry="28" fill="#c8f0ff" opacity="0.55"/>
  <circle cx="140" cy="148" r="110" fill="url(#bodyGlow)" opacity="0.18"/>

  <!-- Sparkle top-left -->
  <g transform="translate(48,62)">
    <line x1="0" y1="-8" x2="0" y2="8"  stroke="#49d7ff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8"  y2="0" stroke="#49d7ff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#49d7ff" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#49d7ff" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Sparkle top-right small -->
  <g transform="translate(228,88)">
    <line x1="0" y1="-5" x2="0" y2="5"  stroke="#90d9ff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5"  y2="0" stroke="#90d9ff" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Left arm (raised / waving) -->
  <g transform="translate(60,148) rotate(-30)">
    <!-- upper arm -->
    <rect x="-13" y="-44" width="26" height="50" rx="13" fill="url(#armGrad)"/>
    <!-- forearm / hand -->
    <g transform="translate(0,12)">
      <rect x="-11" y="0" width="22" height="38" rx="11" fill="url(#armGrad)"/>
      <!-- fingers outline -->
      <rect x="-6" y="30" width="7" height="18" rx="3.5" fill="url(#armGrad)" stroke="#b8e8ff" stroke-width="1"/>
      <rect x="2" y="30" width="7" height="18" rx="3.5" fill="url(#armGrad)" stroke="#b8e8ff" stroke-width="1"/>
    </g>
  </g>

  <!-- Right arm (relaxed, slightly outward) -->
  <g transform="translate(220,162) rotate(12)">
    <rect x="-13" y="-12" width="26" height="46" rx="13" fill="url(#armGrad)"/>
    <g transform="translate(0,38)">
      <rect x="-11" y="0" width="22" height="32" rx="11" fill="url(#armGrad)"/>
    </g>
  </g>

  <!-- Body -->
  <rect x="82" y="148" width="116" height="100" rx="30" fill="url(#bodyGrad)" stroke="#b8e8ff" stroke-width="1.5"/>

  <!-- Body sheen -->
  <ellipse cx="140" cy="168" rx="38" ry="10" fill="white" opacity="0.22"/>

  <!-- Chest badge / R letter -->
  <circle cx="140" cy="192" r="24" fill="white" opacity="0.18"/>
  <circle cx="140" cy="192" r="20" fill="white" opacity="0.22" stroke="#a0d8f0" stroke-width="1"/>
  <text x="140" y="200" text-anchor="middle" font-family="'Outfit',sans-serif" font-size="22" font-weight="800" fill="#1a8bca" opacity="0.9">R</text>

  <!-- Neck -->
  <rect x="124" y="136" width="32" height="20" rx="8" fill="url(#neckGrad)" stroke="#b8e8ff" stroke-width="1"/>

  <!-- Head -->
  <rect x="82" y="72" width="116" height="78" rx="32" fill="url(#headGrad)" stroke="#b8e8ff" stroke-width="1.5"/>

  <!-- Head sheen -->
  <ellipse cx="140" cy="88" rx="36" ry="9" fill="white" opacity="0.25"/>

  <!-- Left eye socket -->
  <ellipse cx="116" cy="112" rx="16" ry="16" fill="#0d3a58" opacity="0.85"/>
  <ellipse cx="116" cy="112" rx="12" ry="12" fill="#0a2e46"/>
  <!-- Left eye glow -->
  <circle cx="116" cy="112" r="9"  fill="url(#eyeGlow)"/>
  <circle cx="116" cy="112" r="5"  fill="#49d7ff"/>
  <circle cx="118" cy="109" r="2"  fill="white" opacity="0.8"/>

  <!-- Right eye socket -->
  <ellipse cx="164" cy="112" rx="16" ry="16" fill="#0d3a58" opacity="0.85"/>
  <ellipse cx="164" cy="112" rx="12" ry="12" fill="#0a2e46"/>
  <!-- Right eye glow -->
  <circle cx="164" cy="112" r="9"  fill="url(#eyeGlow2)"/>
  <circle cx="164" cy="112" r="5"  fill="#49d7ff"/>
  <circle cx="166" cy="109" r="2"  fill="white" opacity="0.8"/>

  <!-- Antenna -->
  <line x1="140" y1="72" x2="140" y2="46" stroke="#a0cfe8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="140" cy="40" r="8" fill="url(#antennaGlow)" stroke="#b8e8ff" stroke-width="1.5"/>
  <circle cx="140" cy="40" r="4" fill="#49d7ff"/>

  <!-- Feet -->
  <rect x="102" y="242" width="30" height="22" rx="11" fill="url(#footGrad)"/>
  <rect x="148" y="242" width="30" height="22" rx="11" fill="url(#footGrad)"/>

  <!-- Leg connectors -->
  <rect x="109" y="232" width="16" height="16" rx="6" fill="url(#legGrad)"/>
  <rect x="155" y="232" width="16" height="16" rx="6" fill="url(#legGrad)"/>

  <defs>
    <radialGradient id="bodyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#49d7ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#49d7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d6f4ff"/>
      <stop offset="100%" stop-color="#b0e4f8"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c2edff"/>
      <stop offset="100%" stop-color="#96d8f5"/>
    </linearGradient>
    <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d0f0ff"/>
      <stop offset="100%" stop-color="#9dd9f5"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b8e8ff"/>
      <stop offset="100%" stop-color="#90d0f0"/>
    </linearGradient>
    <linearGradient id="footGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#b8e8ff"/>
      <stop offset="100%" stop-color="#7ec8e8"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c8eeff"/>
      <stop offset="100%" stop-color="#90d0f0"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#49d7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0080c0" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="eyeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#49d7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0080c0" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="antennaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d0f4ff"/>
      <stop offset="100%" stop-color="#90d0f0"/>
    </radialGradient>
  </defs>
</svg>
