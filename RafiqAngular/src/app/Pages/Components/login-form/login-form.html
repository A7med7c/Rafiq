<section class="login-container" dir="ltr">
    <div class="login-card">

        <div class="card-header">
            <h2>Login</h2>
            <p>Log in to your account.</p>
        </div>

        <form>

            <div class="field">
                <label>Email</label>

                <div class="input-shell">
                    <input
                        type="email"
                        placeholder="Enter your email">
                </div>
            </div>


            <div class="field">

                <label>Password</label>

                <div class="input-shell">

                    <input
                        type="password"
                        placeholder="Enter your password">

                    <button
                        type="button"
                        class="icon-button">

                        <i class="fa-regular fa-eye-slash"></i>

                    </button>

                </div>

            </div>


            <a class="forgot">
                Forgot Password?
            </a>


            <button class="submit-button">
                Log In
            </button>


            <!-- <button class="google-button">

                <img
                    src="images/google.svg"
                    alt="">

                Log in with Google

            </button> -->

        </form>


        <p class="register">

            Don't have an account?

            <a>Sign Up</a>

        </p>

    </div>

</section>
