<section class="login-container" dir="rtl" aria-label="تسجيل الدخول">
    <div class="login-card">
        <header class="card-header">
            <h2>مرحباً مجدداً!</h2>
            <p>سعداء بعودتك</p>
        </header>

        <form>
            <label class="field">
                <span>رقم الهاتف</span>
                <span class="input-shell">
                    <span class="field-icon">⌕</span>
                    <input type="tel" placeholder="+20 1XXXXXXXXX">
                </span>
            </label>

            <label class="field">
                <span>كلمة المرور</span>
                <span class="input-shell">
                    <span class="field-icon">⌑</span>
                    <input type="password" placeholder="أدخل كلمة المرور">
                    <button class="icon-button" type="button" aria-label="إظهار كلمة المرور">◉</button>
                </span>
            </label>

            <a class="forgot">نسيت كلمة المرور؟</a>

            <button class="submit-button" type="submit">
                <span>تسجيل الدخول</span>
                <span aria-hidden="true">←</span>
            </button>
        </form>       

        <p class="register">
            ليس لديك حساب؟
            <a>إنشاء حساب جديد</a>
        </p>
    </div>
</section>
