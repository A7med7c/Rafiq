<main class="landing-page" [class.rtl]="language === 'ar'" [attr.dir]="language === 'ar' ? 'rtl' : 'ltr'">
  <app-navbar
    [language]="language"
    (languageChange)="setLanguage($event)">
  </app-navbar>

  <app-hero [language]="language"></app-hero>

  <app-features [language]="language"></app-features>

  <app-about [language]="language"></app-about>

  <app-how-it-works [language]="language"></app-how-it-works>

  <app-stats [language]="language"></app-stats>

  <app-testimonials [language]="language"></app-testimonials>

  <app-contact [language]="language"></app-contact>

  <app-footer [language]="language"></app-footer>
</main>
