<section id="home" class="hero" [class.hero-ar]="language === 'ar'">
  <div class="container hero-layout">
    <div class="hero-content">
      <p class="subtitle">{{ t.subtitle }}</p>

      <h1>
        <span class="line1">{{ t.line1 }}</span>
        <span class="line2">{{ t.line2 }}</span>
        <span class="line3">{{ t.line3 }}</span>
        <span class="highlight">{{ t.highlight }}</span>
      </h1>

      <p class="description">{{ t.description }}</p>

      <div class="hero-actions">
        <a class="hero-btn" routerLink="/register">{{ t.cta }}</a>
        <button type="button" class="watch-demo">
          <span class="play-circle">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2 1.5L12.5 7L2 12.5V1.5Z" fill="currentColor"/>
            </svg>
          </span>
          <span>{{ t.watchDemo }}</span>
        </button>
      </div>
    </div>

    <div class="hero-image">
      <div class="robot-container">
        <div class="glow"></div>
        <div class="glass-circle"></div>

        <span class="badge-chip heart" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 21s-7.5-4.6-10-9.2C.6 8.3 2.4 4.5 6.2 4a5 5 0 0 1 5.8 3 5 5 0 0 1 5.8-3c3.8.5 5.6 4.3 4.2 7.8C19.5 16.4 12 21 12 21Z" stroke="currentColor" stroke-width="1.7"/>
          </svg>
        </span>
        <span class="badge-chip chart" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 17l6-6 4 4 8-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="badge-chip trend" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 15l5-5 4 4 9-9M21 7v6M21 7h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="badge-chip calendar" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>

        <img src="images/RafiqLogo.png" class="robot" alt="Rafiq AI robot">
      </div>
    </div>
  </div>
</section>
