<section id="testimonials" class="testimonials">
  <div class="container">
    <div class="section-head">
      <h2>{{ t.title }}</h2>
      <p>{{ t.subtitle }}</p>
    </div>

    <div class="testimonials-grid">
      @for (item of t.items; track item.name; let i = $index) {
        <article class="testimonial-card">
          <div class="stars" aria-hidden="true">★★★★★</div>
          <p>{{ item.quote }}</p>
          <div class="testimonial-author">
            <span class="avatar" [style.background]="item.gradient">{{ item.initials }}</span>
            <div>
              <strong>{{ item.name }}</strong>
              <span>{{ item.role }}</span>
            </div>
          </div>
        </article>
      }
    </div>

    <div class="dots">
      @for (item of t.items; track item.name; let i = $index) {
        <button
          type="button"
          [class.active]="activeSlide() === i"
          [attr.aria-label]="'Slide ' + (i + 1)"
          (click)="selectSlide(i)">
        </button>
      }
    </div>
  </div>
</section>
