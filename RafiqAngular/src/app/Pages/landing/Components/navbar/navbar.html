<nav class="navbar">
  <div class="container">
    <div class="logo">
      <img src="images/RafiqLogo.png" alt="logo">
      <span>{{ t.brand }}</span>
    </div>

    <div class="right-side">
      <ul class="nav-links">
        <li>{{ t.home }}</li>
        <li>{{ t.about }}</li>
        <li>{{ t.contact }}</li>
        <li routerLink="/login">{{ t.login }}</li>
      </ul>

      <div class="language-toggle" aria-label="Language switcher">
        <button
          type="button"
          [class.active]="language === 'en'"
          (click)="setLanguage('en')">
          EN
        </button>
        <button
          type="button"
          [class.active]="language === 'ar'"
          (click)="setLanguage('ar')">
          عربي
        </button>
      </div>

      <button class="btn">{{ t.cta }}</button>
    </div>
  </div>
</nav>
