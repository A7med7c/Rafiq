<nav class="navbar" [class.navbar-scrolled]="isScrolled()" [class.menu-open]="isMenuOpen()">
  @if (isMenuOpen()) {
    <button
      type="button"
      class="menu-backdrop"
      (click)="closeMenu()"
      [attr.aria-label]="t.closeMenu">
    </button>
  }

  <div class="container">
    <div class="navbar-inner">
      <button type="button" class="logo" (click)="navigateToSection('home')" [attr.aria-label]="t.home">
        <img src="images/RafiqLogo.png" alt="Rafiq logo">
        <span>{{ t.brand }}</span>
      </button>

      <div class="language-toggle" aria-label="Language switcher">
        <button
          type="button"
          [class.active]="l10n.lang() === 'en'"
          (click)="setLanguage('en')">
          EN
        </button>
        <button
          type="button"
          [class.active]="l10n.lang() === 'ar'"
          (click)="setLanguage('ar')">
          AR
        </button>
      </div>
      <button
        type="button"
        class="menu-toggle"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="isMenuOpen() ? t.closeMenu : t.openMenu"
        (click)="toggleMenu()">
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
      </button>

      <div class="right-side" id="mobile-nav">
        <ul class="nav-links">
          <li>
            <button
              type="button"
              [class.active]="activeSection() === 'home'"
              (click)="navigateToSection('home')">
              {{ t.home }}
            </button>
          </li>
          <li>
            <button
              type="button"
              [class.active]="activeSection() === 'about'"
              (click)="navigateToSection('about')">
              {{ t.about }}
            </button>
          </li>
          <li>
            <button
              type="button"
              [class.active]="activeSection() === 'features'"
              (click)="navigateToSection('features')">
              {{ t.features }}
            </button>
          </li>
          <li>
            <button
              type="button"
              [class.active]="activeSection() === 'how-it-works'"
              (click)="navigateToSection('how-it-works')">
              {{ t.howItWorks }}
            </button>
          </li>
          <li>
            <button
              type="button"
              [class.active]="activeSection() === 'testimonials'"
              (click)="navigateToSection('testimonials')">
              {{ t.testimonials }}
            </button>
          </li>
          <li>
            <button
              type="button"
              [class.active]="activeSection() === 'contact'"
              (click)="navigateToSection('contact')">
              {{ t.contact }}
            </button>
          </li>
        </ul>

        <div class="navbar-actions">
          <div class="language-toggle" aria-label="Language switcher">
            <button
              type="button"
              [class.active]="l10n.lang() === 'en'"
              (click)="setLanguage('en')">
              EN
            </button>
            <button
              type="button"
              [class.active]="l10n.lang() === 'ar'"
              (click)="setLanguage('ar')">
              عربي
            </button>
          </div>

          @if (isAuthenticated) {
            <div class="auth-actions authenticated">
              <span class="account-name">{{ displayName }}</span>
              <button type="button" class="btn btn-dashboard" (click)="onGetStarted()">
                {{ t.dashboard }}
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                (click)="signOut()"
                [disabled]="isSigningOut()">
                {{ isSigningOut() ? t.signingOut : t.signOut }}
              </button>
            </div>
          } @else {
            <div class="auth-actions">
              <a class="nav-login" routerLink="/login">{{ t.login }}</a>
              <button type="button" class="btn" (click)="onGetStarted()">{{ t.cta }}</button>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</nav>
