<div class="onboarding-welcome-page">
  <!-- Background decorative blobs -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <div class="onboarding-layout">
    <div class="onboarding-card">
      <!-- Header / Brand -->
      <div class="brand-header">
        <div class="brand-logo">
          <img src="images/RafiqLogo.png" alt="Rafiq AI Logo" class="brand-icon" />
          <div class="brand-text">
            <span class="brand-name">Rafiq AI</span>
            <span class="brand-tagline">Family Health Assistant</span>
          </div>
        </div>
      </div>

      <!-- Hero Illustration -->
      <div class="hero-illustration">
        <img src="assets/icons/onboarding-hero.svg" alt="Health Profile Illustration" />
      </div>

      <!-- Welcome Text -->
      <div class="welcome-content">
        <h1 class="welcome-title">Welcome to Rafiq! 👋</h1>
        <p class="welcome-subtitle">Let's build your Health Profile</p>
        <p class="welcome-description">
          This helps us personalize your experience and provide better AI insights for you.
        </p>
      </div>

      <!-- Feature Cards -->
      <div class="feature-cards">
        <div class="feature-card">
          <div class="feature-icon">
            <i class="fas fa-brain"></i>
          </div>
          <div class="feature-text">
            <span class="feature-title">Personalized AI</span>
            <span class="feature-desc">Better insights for your health</span>
          </div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">
            <i class="fas fa-chart-line"></i>
          </div>
          <div class="feature-text">
            <span class="feature-title">Smarter Tracking</span>
            <span class="feature-desc">Track what matters most</span>
          </div>
        </div>
      </div>

      <!-- CTA Button -->
      <button class="cta-button" (click)="getStarted()">
        <span>Get Started</span>
        <i class="fas fa-arrow-right"></i>
      </button>

      <!-- Footer note -->
      <p class="footer-note">
        <i class="far fa-clock"></i>
        This will take less than 2 minutes
      </p>
    </div>
  </div>
</div>
