<div class="onboarding-welcome-page" [dir]="l10n.dir()">

  <div class="onboarding-card">

    <!-- Mascot Stage -->
    <div class="mascot-stage">
      <div class="mascot-aura">
        <div class="aura-circle-bg"></div>
        <div class="aura-dashed-ring"></div>
        <span class="aura-sparkle sparkle-top-left">✦</span>
        <span class="aura-sparkle sparkle-top-right">✦</span>
        <span class="aura-sparkle sparkle-bottom-right">✦</span>
        <span class="aura-dot dot-left"></span>
        <span class="aura-dot dot-right"></span>

        <!-- Robot avatar -->
        <app-avatar-engine size="160px" state="speaking" />
      </div>
      <div class="mascot-ground-shadow"></div>
    </div>

    <!-- Welcome Header: Speech Bubble + Title -->
    <div class="welcome-header" assistantAnchor="onboarding-welcome-heading">
      <div class="speech-bubble-icon" aria-hidden="true">
        <svg width="38" height="38" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g filter="url(#bubbleShadow)">
            <path d="M7 16C7 9.92487 11.9249 5 18 5H22C28.0751 5 33 9.92487 33 16C33 22.0751 28.0751 27 22 27H16.5L10.7929 32.7071C10.1629 33.3371 9.08579 32.8906 9.08579 32V26.4142C7.77884 25.0573 7 23.123 7 21V16Z" fill="url(#bubbleGrad)"/>
            <circle cx="14" cy="16" r="2.2" fill="white"/>
            <circle cx="20" cy="16" r="2.2" fill="white"/>
            <circle cx="26" cy="16" r="2.2" fill="white"/>
          </g>
          <defs>
            <linearGradient id="bubbleGrad" x1="7" y1="5" x2="33" y2="33" gradientUnits="userSpaceOnUse">
              <stop stop-color="#49d7ff"/>
              <stop offset="1" stop-color="#0EAFD7"/>
            </linearGradient>
            <filter id="bubbleShadow" x="3" y="3" width="34" height="36" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
              <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0EAFD7" flood-opacity="0.3"/>
            </filter>
          </defs>
        </svg>
      </div>
      <h1 class="welcome-title">{{ t().onboarding.welcome.title }}</h1>
    </div>

    <!-- Description text with highlighted key terms -->
    <p class="welcome-description" [innerHTML]="t().onboarding.welcome.subtitle2"></p>

    <!-- Action Button -->
    <button class="cta-button" (click)="getStarted()">
      <span>{{ t().onboarding.welcome.getStarted }}</span>
      <svg class="cta-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>

  </div>

</div>
