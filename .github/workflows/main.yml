name: Deploy Rafiq Backend

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src/src.sln"
      - ".github/workflows/backend-deploy.yml"

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/src.sln

      - name: Build
        run: dotnet build src/src.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/Rafiq.API/Rafiq.API.csproj --configuration Release --no-build --output ./publish

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.PUBLISH_PROFILE }}
          package: ./publish
