name: Deploy Rafiq Backend

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/main.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/src.sln

      - name: Build
        run: dotnet build src/src.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/src.sln --configuration Release --no-build --verbosity normal

      - name: Publish API
        run: >
          dotnet publish src/Rafiq.API/Rafiq.API.csproj
          --configuration Release
          --no-build
          --output ./publish

      - name: Deploy to MonsterASP.NET
        uses: azure/webapps-deploy@v3
        with:
          publish-profile: ${{ secrets.PUBLISH_PROFILE }}
          package: ./publish
